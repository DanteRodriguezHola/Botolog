{% extends '_Blog/base.html'%}

{% block title %}

    Botolog

{% endblock %}

{% block content %}
   
    {% for post in posts %}

    <article>

        <header>

            <h2 class = 'highlight heading'>
                
                {{ post.shortened_heading }}
            
            </h2>

            <p class = 'overshadow date smaller'>
                
                [{{ post.date }}]
            
            </p>

        </header>

        <p class = 'overshadow drophead smaller'>

            {{ post.drophead}} 
        
        </p>

        <a href = "{% url 'detail' post.slug %}"> 
            
            Leer más 

        </a>

    </article>

    {% endfor %}

{% endblock %}
